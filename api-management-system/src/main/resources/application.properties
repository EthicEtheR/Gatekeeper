spring.application.name=api-management-system

server.port=8094

info.service.name= Api Management Service
info.service.description=Management service for Users,routes and gateway policies.

spring.datasource.url=jdbc:mysql://localhost:3306/gateway-management
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#logging.level.org.flywaydb=DEBUG

jwt.expiry.in.second=3600
jwt.secret.key=${JWT_SECRET}