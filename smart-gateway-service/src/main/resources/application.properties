spring.application.name=smart-gateway-service

server.port=8090

info.service.name= Smart Gateway Service.
info.service.description=This service helps in routing, security and rate limiting of in coming request.

#rest client config --->
management.api.base-url=${API_MANAGEMENT_URL}
management.api.username=${GATEWAY_USERNAME}
management.api.password=${GATEWAY_PASSWORD}

#kafka consumer config --->
gateway.kafka.configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC}
gateway.kafka.configuration-group=${GATEKEEPER_CONFIGURATION_GROUP}
spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS}

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


spring.data.redis.host.port= localhost:6380
